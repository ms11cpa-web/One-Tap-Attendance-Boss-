<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow Inner Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="800" stroke-dashoffset="240" stroke-linecap="round" />

  <!-- Center Badge / Shield with Checkmark & Pulse -->
  <g filter="url(#shadow)">
    <!-- Hexagonal / Shield Base -->
    <path d="M256 120 L360 176 V270 C360 340 310 392 256 414 C202 392 152 340 152 270 V176 Z" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Bold 'B' monogram integrated with clock & checkmark -->
    <path d="M216 195 H265 C285 195 298 206 298 222 C298 234 290 242 278 247 C294 252 304 263 304 282 C304 302 288 317 265 317 H216 Z" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="252" y1="250" x2="220" y2="250" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    
    <!-- Emerald Presence Pulse Dot -->
    <circle cx="330" cy="190" r="16" fill="#10b981" />
    <circle cx="330" cy="190" r="26" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6" />
  </g>
</svg>
